  </head>

    <!-- ========================================

    <header>

        </nav>

        <button class="hamburger" id="hamburger" aria-label="メニューを開く">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- ========================================
         ハンバーガーメニュー
    ======================================== -->

    <div class="menu-panel" id="menu-panel">
      <nav class="menu-nav">

    <!-- ========================================

    ======================================== -->

    <main class="event-detail-main">
      <!-- ページタイトル -->

      <section class="event-detail-hero">
        <p class="event-detail-label">桂川祭 企画</p>

        <h1 id="event-title">企画名</h1>

        <p id="event-organizer" class="event-detail-organizer">企画団体名</p>
      </section>

      <!-- ========================================
           企画詳細
      ======================================== -->

      <section class="event-detail-content">
        <!-- 企画画像 -->

        <div class="event-detail-image" id="event-image">
          <span>画像準備中</span>
        </div>

        <!-- 詳細説明 -->

        <div class="event-detail-section">
          <h2>企画について</h2>

          <p id="event-detail">企画の詳細がここに表示されます。</p>
        </div>

        <!-- 基本情報 -->

        <div class="event-detail-section">
          <h2>基本情報</h2>

          <dl class="event-info-list">
            <div>
              <dt>カテゴリー</dt>
              <dd id="event-category">―</dd>
            </div>

            <div>
              <dt>対象</dt>
              <dd id="event-recommended">―</dd>
            </div>

            <div>
              <dt>料金</dt>
              <dd id="event-fee">―</dd>
            </div>

            <div>
              <dt>予約</dt>
              <dd id="event-reservation">―</dd>
            </div>
          </dl>
        </div>

        <!-- タグ -->

        <div class="event-detail-section">
          <h2>タグ</h2>

          <div id="event-tags" class="event-detail-tags">
            <!-- JavaScriptで表示 -->
          </div>
        </div>

        <!-- 開催情報 -->

        <div class="event-detail-section">
          <h2>開催日時・場所</h2>

          <div id="event-schedule" class="event-schedule">
            <!-- JavaScriptで表示 -->
          </div>
        </div>

        <!-- 注意事項 -->

        <div
          class="event-detail-section event-notes-section"
          id="event-notes-section"
        >
          <h2>注意事項</h2>

          <p id="event-notes">―</p>
        </div>

        <!-- 企画一覧へ戻る -->

        <div class="event-detail-back">
          <a href="event.html"> ← 企画一覧に戻る </a>
        </div>
      </section>
    </main>

    <!-- ========================================

    <footer>

    <script src="project.js"></script>

    <script src="event-detail.js"></script>
