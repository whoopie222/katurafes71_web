<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>桂川祭｜企画検索</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p&family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="events-page">
    <header class="events-header">
      <nav>
        <div class="logo">
          <p>第71回</p>
          <h1>桂川祭</h1>
        </div>

        <ul class="nav-bar">
          <li class="dropdown">
            <a href="index.html" class="gothic">桂川祭について</a>
          </li>
          <li class="dropdown">
            <a href="events.html" class="gothic">企画</a>
          </li>
          <li class="dropdown">
            <a href="timetable.html" class="gothic">タイムテーブル</a>
          </li>
          <li class="dropdown">
            <a href="firsttime-visitor.html" class="gothic">初めての方へ</a>
          </li>
          <li class="dropdown">
            <a href="Q" class="gothic">Q&A</a>
          </li>
          <li class="dropdown">
            <a href="pamphlet.html" class="gothic">パンフレット</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="search-page">
      <aside class="search-sidebar">
        <div class="search-sidebar-inner">
          <div class="search-heading">
            <span class="search-heading-small">第71回</span>
            <h1>企画を探す</h1>
          </div>

          <div class="search-box">
            <input
              type="search"
              id="searchInput"
              placeholder="企画名・タグなどで検索"
              autocomplete="off"
            />
            <button
              type="button"
              id="clearSearch"
              class="clear-search"
              aria-label="検索をクリア"
            >
              ×
            </button>
          </div>

          <div class="filter-groups">
            <div class="filter-group">
              <h3>日付</h3>
              <div class="tag-list">
                <button class="tag" data-tag="10/29">10/29</button>
                <button class="tag" data-tag="10/30">10/30</button>
                <button class="tag" data-tag="10/31">10/31</button>
              </div>
            </div>

            <div class="filter-group">
              <h3>主催者</h3>
              <div class="tag-list">
                <button class="tag" data-tag="大型企画">大型企画</button>
                <button class="tag" data-tag="体験型企画">体験型企画</button>
                <button class="tag" data-tag="装飾企画">装飾企画</button>
                <button class="tag" data-tag="ステージ企画">
                  ステージ企画
                </button>
                <button class="tag" data-tag="団体">団体</button>
                <button class="tag" data-tag="委員会企画">委員会企画</button>
              </div>
            </div>

            <div class="filter-group">
              <h3>おすすめ</h3>
              <div class="tag-list">
                <button class="tag" data-tag="子どもにおすすめ">
                  子どもにおすすめ
                </button>
                <button class="tag" data-tag="大人におすすめ">
                  大人におすすめ
                </button>
              </div>
            </div>

            <div class="filter-group">
              <h3>コンテンツ</h3>
              <div class="tag-list">
                <button class="tag" data-tag="食品">食品</button>
                <button class="tag" data-tag="遊び">遊び</button>
                <button class="tag" data-tag="展示">展示</button>
                <button class="tag" data-tag="パフォーマンス">
                  パフォーマンス
                </button>
              </div>
            </div>

            <div class="filter-group">
              <h3>場所</h3>
              <div class="tag-list">
                <button class="tag" data-tag="ステージ">ステージ</button>
                <button class="tag" data-tag="3号館">3号館</button>
                <button class="tag" data-tag="5号館">5号館</button>
                <button class="tag" data-tag="6号館">6号館</button>
                <button class="tag" data-tag="テント">テント</button>
                <button class="tag" data-tag="体育館">体育館</button>
              </div>
            </div>

            <div class="filter-group">
              <h3>所要時間</h3>
              <div class="tag-list">
                <button class="tag" data-tag="〜10分">〜10分</button>
                <button class="tag" data-tag="10〜20分">10〜20分</button>
                <button class="tag" data-tag="20〜30分">20〜30分</button>
                <button class="tag" data-tag="30〜40分">30〜40分</button>
                <button class="tag" data-tag="40分以上">40分以上</button>
                <button class="tag" data-tag="好きなだけ">好きなだけ</button>
              </div>
            </div>
          </div>

          <button type="button" id="resetFilters" class="reset-filters">
            すべての企画を見る
          </button>
        </div>
      </aside>

      <section class="contents-area">
        <div class="contents-header">
          <div>
            <p class="contents-kicker">EVENTS</p>
            <h2>企画一覧</h2>
          </div>
          <p id="resultCount" class="result-count"></p>
        </div>

        <div id="projectList" class="project-grid"></div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="project.js"></script>
    <script src="event.js"></script>
  </body>
</html>
